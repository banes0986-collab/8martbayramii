# BalikAC Config

general:
  alert-broadcast: true          # Şüpheli oyuncu tespit edildiğinde yetkililere mesaj gönder
  debug: false                    # Konsola detaylı VL loglarını yazdır

checks:
  killaura:
    enabled: true
    max-angle-difference: 15.0    # Vuruş anındaki bakış açısı ile hedefe olan gerçek açı farkı (derece)
    max-hits-per-second: 12       # Saniyede izin verilen maksimum vuruş sayısı
    vl-to-flag: 6                 # Alert göndermek için gereken violation seviyesi
    vl-to-kick: 20                # Otomatik kick için gereken violation seviyesi (0 = kapalı)

  autototem:
    enabled: true
    min-swap-ticks: 2             # Totem takas etmenin insan-mümkün minimum tick süresi (1 tick=50ms)
    vl-to-flag: 5
    vl-to-kick: 0

  crystalaura:
    enabled: true
    max-place-to-break-ticks: 1   # Kristal koyup patlatma arasındaki minimum insan tick süresi
    max-angle-difference: 20.0
    vl-to-flag: 6
    vl-to-kick: 0

  xray:
    enabled: true
    tracked-ores:
      - DIAMOND_ORE
      - DEEPSLATE_DIAMOND_ORE
      - ANCIENT_DEBRIS
      - EMERALD_ORE
      - DEEPSLATE_EMERALD_ORE
    min-exposed-faces-to-flag: 1  # Cevher kırılmadan önce kaç yüzü açıkta olmalı (0 = tüm kazılar şüpheli)
    suspicious-ratio: 0.65        # Toplam kazılan bloklara oranla "direkt cevhere gitme" oranı eşiği
    vl-to-flag: 8
    vl-to-kick: 0                 # X-ray otomatik kick önerilmez, sadece staff'a bildir

  clientbrand:
    enabled: true
    # Uyarı: istemci "brand" bilgisini gönüllü bildirir. Kendini "vanilla" olarak
    # spoof eden hile client'ları bu yöntemle YAKALANMAZ. Bu sadece ek bir katmandır.
    action: ban                   # ban | kick | alert
    banned-keywords:
      - meteor
      - wurst
      - impact
      - aristois
      - sigma
      - future
      - rusherhack
      - liquidbounce
      - salhack
      - inertia
      - kami
      - novoline
      - moon
      - ares
      - clover
      - onehop
      
