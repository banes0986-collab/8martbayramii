name: SalxAET
version: 2.0
main: com.legacy.salxaet.LAnticheat
api-version: '1.21'
author: LegacyNetwork
description: LegacyNetwork Ozel AntiCheat

depend: [ProtocolLib]

permissions:
  salxaet.admin:
    description: SalxAET yonetici yetkisi (komutlar + alert bildirimleri)
    default: op
  salxaet.bypass:
    description: AntiCheat kontrollerinden muaf tutulma
    default: false

commands:
  salxaet:
    description: SalxAET ana komutu
    permission: salxaet.admin
    usage: /<command> <reload|enable|disable|status|debug>
