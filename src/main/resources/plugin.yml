name: BalikAC
version: '${project.version}'
main: com.balikac.anticheat.BalikAC
api-version: '1.21'
author: Balik
description: Basit ama etkili anti-cheat eklentisi (KillAura, AutoTotem, CrystalAura, Xray tespiti)

commands:
  balikac:
    description: BalikAC yönetim komutu
    usage: /balikac <reload|alerts|check>
    permission: balikac.admin
    aliases: [bac]

permissions:
  balikac.admin:
    description: BalikAC yönetim komutlarına erişim
    default: op
  balikac.alerts:
    description: Hile uyarılarını (alert) görme yetkisi
    default: op
    
